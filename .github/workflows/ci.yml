name: CI & App Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 g++-14 cmake pkg-config \
            libuv1-dev libyaml-dev libsqlite3-dev libssl-dev \
            libcurl4-openssl-dev zlib1g-dev sqlite3 curl python3

      - name: Build backend
        run: |
          cd backend
          CC=gcc-14 CXX=g++-14 cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Run backend integration tests
        run: |
          cd backend
          ./tests/test_link.sh
          ./tests/test_2fa.sh
          ./tests/test_dca_cashflow.sh
          ./tests/test_ai_trace.sh
          ./tests/test_market_sync.sh
          ./tests/test_ledgers.sh
          ./tests/test_fx_oauth.sh

  frontend:
    name: Frontend Typecheck, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Desktop typecheck & build
        run: npm run build

      - name: Mobile typecheck & build
        run: npm run build:mobile

  docker-build:
    name: Build & Package Docker Image
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker container (PR only)
        if: github.event_name == 'pull_request'
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker run -d --name minefolio-smoke-test \
            -p 8080:8080 \
            -e MINEFOLIO_JWT_SECRET="ci_test_jwt_secret_12345678" \
            $IMAGE_TAG
          
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8080/api/system/status | grep -q "0"; then
              echo "✅ Docker image smoke test passed!"
              docker stop minefolio-smoke-test
              exit 0
            fi
            sleep 1
          done
          echo "❌ Docker container failed healthcheck"
          docker logs minefolio-smoke-test
          exit 1

  android-build:
    name: Build Android APK
    needs: [frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build mobile assets
        run: npm run build:mobile

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: minefolio-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-build:
    name: Build iOS Package
    needs: [frontend]
    runs-on: macos-14
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build mobile assets
        run: npm run build:mobile

      - name: Initialize & Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Build unsigned iOS App & Archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r Minefolio-iOS-unsigned.ipa Payload

      - name: Upload iOS Package
        uses: actions/upload-artifact@v4
        with:
          name: minefolio-ios-unsigned-ipa
          path: frontend/ios/App/build/Minefolio-iOS-unsigned.ipa
          if-no-files-found: error
