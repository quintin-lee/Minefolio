name: Sanitizers (ASan & UBSan)

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC (11:00 CST)
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/sanitizers.yml'
      - 'backend/src/**'
      - 'backend/CMakeLists.txt'
      - 'backend/tests/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/sanitizers.yml'

jobs:
  backend-sanitizers-sqlite:
    name: Backend ASan & UBSan Tests (SQLite)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 g++-14 cmake pkg-config \
            libuv1-dev libyaml-dev libsqlite3-dev libssl-dev \
            libcurl4-openssl-dev zlib1g-dev sqlite3 curl python3 nodejs jq

      - name: Build backend with ASan & UBSan
        env:
          # ASan ~doubles every allocation; raise the build ceiling so the
          # csilk compile peak doesn't OOM the runner. See tests/memory_guard.sh.
          MINEFOLIO_BUILD_MEM_LIMIT: "12G"
        run: |
          cd backend
          CC=gcc-14 CXX=g++-14 cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMINEFOLIO_SANITIZE=ON
          # Throttle parallelism + hard memory cap for the ASan build.
          JOBS=$(($(nproc) / 2)); [ "$JOBS" -lt 1 ] && JOBS=1
          cmake --build build --parallel "$JOBS"

      - name: Run CTest unit tests (ASan & UBSan)
        env:
          ASAN_OPTIONS: "hard_rss_limit_mb=2048:detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/backend/tests/.lsan-suppressions"
          # Run the 55 suites serially (-j1) under a cgroup ceiling so a single
          # ASan suite cannot OOM the runner. Raise if the host is larger.
          MINEFOLIO_CTEST_MEM_LIMIT: "12G"
        run: |
          cd backend/build
          # Cap ctest in a systemd cgroup scope when available; the runner's
          # ASan test binaries reserve large virtual ranges. Convert the G-based
          # limit to KiB for the cgroup property (cgroup wants KiB).
          # Guard against an empty/malformed MINEFOLIO_CTEST_MEM_LIMIT.
          MEM_G="${MINEFOLIO_CTEST_MEM_LIMIT%G}"; [ -z "$MEM_G" ] && MEM_G=12
          [[ "$MEM_G" =~ ^[0-9]+$ ]] || MEM_G=12
          MEM_KB=$(( MEM_G * 1024 * 1024 ))
          if command -v systemd-run >/dev/null 2>&1; then
            JOBS=$(($(nproc) / 2)); [ "$JOBS" -lt 1 ] && JOBS=1
            systemd-run --user --quiet --scope -p "MemoryMax=${MEM_KB}K" \
              -p MemorySwapMax=0 -p TasksMax=4096 \
              bash -c "ctest --output-on-failure -j${JOBS}" || \
              ctest --output-on-failure -j"${JOBS}"
          else
            ctest --output-on-failure -j1
          fi

      - name: Run full backend integration tests (SQLite, ASan & UBSan)
        env:
          ASAN_OPTIONS: "hard_rss_limit_mb=2048:detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/backend/tests/.lsan-suppressions"
          MINEFOLIO_DB_DRIVER: sqlite
          # ASan servers reserve ~2x memory. Under ASan the virtual ulimit cap is
          # skipped (it aborts ASan at startup); the effective ceiling is this
          # cgroup RSS limit applied by mf_exec_isolated. Raise it so a healthy
          # ASan server isn't OOM-killed by the 2G default.
          MINEFOLIO_TEST_MEM_MAX: "8G"
        run: |
          cd backend
          ./tests/test_link.sh
          ./tests/test_2fa.sh
          ./tests/test_dca_cashflow.sh
          ./tests/test_ai_trace.sh
          ./tests/test_ai_tool_call.sh
          ./tests/test_market_sync.sh
          ./tests/test_ledgers.sh
          ./tests/test_fx_oauth.sh
          ./tests/test_ai_loop_hardening.sh
          ./tests/test_mcp_server.sh

  backend-sanitizers-postgres:
    name: Backend ASan & UBSan Tests (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: minefolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 g++-14 cmake pkg-config \
            libuv1-dev libyaml-dev libsqlite3-dev libssl-dev \
            libcurl4-openssl-dev zlib1g-dev sqlite3 curl python3 \
            libpq-dev postgresql-client nodejs jq

      - name: Build backend with PostgreSQL support & ASan + UBSan
        env:
          MINEFOLIO_BUILD_MEM_LIMIT: "12G"
        run: |
          cd backend
          CC=gcc-14 CXX=g++-14 cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMINEFOLIO_SANITIZE=ON
          # Throttle parallelism for the ASan build to halve the compile peak.
          JOBS=$(($(nproc) / 2)); [ "$JOBS" -lt 1 ] && JOBS=1
          cmake --build build --parallel "$JOBS"

      - name: Run full backend integration tests (PostgreSQL, ASan & UBSan)
        env:
          ASAN_OPTIONS: "hard_rss_limit_mb=2048:detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/backend/tests/.lsan-suppressions"
          MINEFOLIO_DB_DRIVER: postgres
          # ASan: virtual cap is skipped; this cgroup RSS limit is the effective ceiling.
          MINEFOLIO_TEST_MEM_MAX: "8G"
          MINEFOLIO_DB_DSN: "host=localhost port=5432 user=postgres password=postgres_password dbname=minefolio_test sslmode=disable"
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres_password
          PGDATABASE: minefolio_test
        run: |
          cd backend
          ./tests/test_link.sh
          ./tests/test_2fa.sh
          ./tests/test_dca_cashflow.sh
          ./tests/test_ai_trace.sh
          ./tests/test_ai_tool_call.sh
          ./tests/test_market_sync.sh
          ./tests/test_ledgers.sh
          ./tests/test_fx_oauth.sh
          ./tests/test_ai_loop_hardening.sh
          ./tests/test_mcp_server.sh
