# nginx/minefolio.docker.conf
server {
    listen 80;
    server_name _;

    # 前端静态文件
    location / {
        root /opt/minefolio/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # AI SSE 流式对话：关闭缓冲与压缩，确保即时推送到前端
    location ^~ /api/ai/chat {
        proxy_pass http://minefolio:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        tcp_nodelay on;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-transform";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://minefolio:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI docs (served by csilk)
    location /docs {
        proxy_pass http://minefolio:8080/docs;
    }
    location /swagger {
        proxy_pass http://minefolio:8080/swagger;
    }
    location = /openapi {
        proxy_pass http://minefolio:8080/openapi.json;
    }
    location /openapi.json {
        proxy_pass http://minefolio:8080/openapi.json;
    }
    location /csilk-docs/ {
        proxy_pass http://minefolio:8080/csilk-docs/;
    }

    # csilk Admin UI & Metrics Dashboard
    location /csilk-admin/ {
        proxy_pass http://minefolio:8080/csilk-admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 健康检查
    location /healthz {
        proxy_pass http://minefolio:8080;
    }
}
