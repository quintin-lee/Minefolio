# nginx/minefolio.docker.conf
server {
    listen 80;
    server_name _;

    # 前端静态文件
    location / {
        root /opt/minefolio/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://minefolio:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI docs (served by csilk)
    location /docs {
        proxy_pass http://minefolio:8080/docs;
    }
    location /csilk-docs/ {
        proxy_pass http://minefolio:8080/csilk-docs/;
    }

    # 健康检查
    location /healthz {
        proxy_pass http://minefolio:8080;
    }
}
