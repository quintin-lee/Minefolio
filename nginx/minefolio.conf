# nginx/minefolio.conf
server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # 前端静态文件
    location / {
        root /opt/minefolio/frontend/dist;
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # AI SSE 流式对话与工作流执行：关闭缓冲与压缩，确保即时推送到前端
    location ~ ^/api/ai/(chat|workflows/run)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        tcp_nodelay on;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control "no-cache, no-transform";
    }

    # MCP Streamable HTTP 端点（浏览器直接访问/刷新 HTML 页面时回退到前端 SPA）
    location = /mcp {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI docs (served by csilk)
    # WARNING: 公网生产环境部署时建议取消注释 ACL 限制（allow 10.0.0.0/8; deny all;）或移除以下文档路由，避免暴露完整 API/Schema 元数据
    location /docs {
        proxy_pass http://127.0.0.1:8080/docs;
    }
    location /swagger {
        proxy_pass http://127.0.0.1:8080/swagger;
    }
    location = /openapi {
        proxy_pass http://127.0.0.1:8080/openapi.json;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8080/openapi.json;
    }
    location /csilk-docs/ {
        proxy_pass http://127.0.0.1:8080/csilk-docs/;
    }

    # csilk Admin UI & Metrics Dashboard
    # WARNING: 公网生产环境部署时建议增加 IP 白名单或移除外部代理暴露
    location = /admin {
        return 301 /csilk-admin/;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8080/csilk-admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /csilk-admin {
        return 301 /csilk-admin/;
    }
    location /csilk-admin/ {
        proxy_pass http://127.0.0.1:8080/csilk-admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /healthz {
        proxy_pass http://127.0.0.1:8080;
    }
}
