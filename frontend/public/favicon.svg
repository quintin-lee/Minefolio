<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0d1b33"/>
      <stop offset="100%" stop-color="#060b18"/>
    </radialGradient>
    <radialGradient id="coinGrad" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="arrowGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#4cc9ff"/>
    </linearGradient>
  </defs>

  <!-- rounded-square background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#0e2a4d" stroke-width="6"/>

  <!-- upward growth arrow (chart line with arrowhead), rising to top-right -->
  <g stroke="url(#arrowGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 352 L252 250 L312 300 L382 194"/>  <!-- polyline -->
  </g>
  <!-- arrowhead -->
  <g fill="url(#arrowGrad)">
    <path d="M382 194 L392 260 L432 208 Z"/>
  </g>

  <!-- gold coin sitting over the lower-left portion -->
  <circle cx="205" cy="300" r="108" fill="url(#coinGrad)"/>
  <circle cx="205" cy="300" r="108" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="8"/>
  <!-- inner minted ring -->
  <circle cx="205" cy="300" r="78" fill="none" stroke="#fef3c7" stroke-width="10" opacity="0.85"/>
  <!-- coin star/mark -->
  <path d="M205 258 L216 286 L246 290 L224 310 L230 340 L205 325 L180 340 L186 310 L164 290 L194 286 Z"
        fill="#b45309" opacity="0.75"/>
  <!-- highlight -->
  <ellipse cx="175" cy="265" rx="40" ry="26" fill="#ffffff" opacity="0.18" transform="rotate(-25 175 265)"/>
</svg>
