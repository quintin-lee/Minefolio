# ============================================================================
# Minefolio 生产编排
#
# 默认: SQLite (内置于 minefolio-data 卷), 无需额外服务。
#
# 可选: 同时部署 PostgreSQL —— 在 .env 中设置
#       COMPOSE_PROFILES=postgres
#       MINEFOLIO_DB_DRIVER=postgres
#       MINEFOLIO_DB_PASSWORD=<强随机密码>
#   然后: docker compose up -d
#   或命令行: docker compose --profile postgres up -d
#
#   说明: 自 2026-10 起 Dockerfile 默认安装 libpq, 无需额外 build-arg;
#   启用 Postgres 仅需将 .env 中 MINEFOLIO_DB_DRIVER 改为 postgres 并配置密码。
#   若使用旧版镜像 (无 libpq), 可本地重新构建:
#         docker build -t <image>:latest .
# ============================================================================
services:
  minefolio:
    image: ghcr.io/quintin-lee/minefolio:${MINEFOLIO_VERSION:-1.4.1}
    container_name: minefolio
    expose:
      - "8080"
    environment:
      MINEFOLIO_JWT_SECRET: "${MINEFOLIO_JWT_SECRET:?MINEFOLIO_JWT_SECRET is required}"
      MINEFOLIO_GATEWAY_TOKEN: "${MINEFOLIO_GATEWAY_TOKEN:-}"
      MINEFOLIO_DB_DRIVER: ${MINEFOLIO_DB_DRIVER:-sqlite}
      MINEFOLIO_DB_DSN: ${MINEFOLIO_DB_DSN:-/app/data/minefolio.db}
      # 供 db-wait.sh 在 DRIVER=postgres 且未显式指定 DSN 时推导连接串;
      # sqlite 模式留空即可, 用 :- 而不用 :? 以免破坏默认 SQLite 启动。
      MINEFOLIO_DB_PASSWORD: ${MINEFOLIO_DB_PASSWORD:-}
      MINEFOLIO_DB_USER: ${MINEFOLIO_DB_USER:-minefolio}
      MINEFOLIO_DB_NAME: ${MINEFOLIO_DB_NAME:-minefolio}
      MINEFOLIO_ENABLE_CSRF: "1"
      TRUST_PROXY: "1"
      TZ: "Asia/Shanghai"
      npm_config_cache: "/app/data/.npm"
    # 启动前检查: 驱动为 postgres 时等待 DB 就绪并推导 DSN; sqlite 时直接放行。
    # 数据库配置完全由 MINEFOLIO_DB_DRIVER / MINEFOLIO_DB_DSN 环境变量提供，
    # /system/setup 接口不再写入 config/db.json (避免容器部署时残留文件与 env
    # 优先级冲突导致已初始化部署被误判为未初始化)。
    # 保持镜像默认 ENTRYPOINT (tini), 用 command 覆盖注入等待逻辑。
    command: ["/usr/local/bin/db-wait.sh"]
    volumes:
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
      - minefolio-data:/app/data
      - ./docker/db-wait.sh:/usr/local/bin/db-wait.sh:ro
    # 资源限制: 防异常分配/连接风暴拖垮宿主 (正常峰值远低于限, 上限只兜底)。
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # 可选 PostgreSQL 服务 —— 仅当 postgres profile 激活时创建。
  db-postgres:
    image: postgres:${POSTGRES_VERSION:-16.8}
    container_name: minefolio-postgres
    profiles:
      - postgres
    environment:
      POSTGRES_USER: ${MINEFOLIO_DB_USER:-minefolio}
      # --profile postgres 启动时必须设置非空 MINEFOLIO_DB_PASSWORD（例如在 .env 中配置），
      # 否则 postgres 镜像会因 POSTGRES_PASSWORD 为空而拒绝初始化（此处保留 :- 以免影响默认 SQLite 启动）。
      POSTGRES_PASSWORD: ${MINEFOLIO_DB_PASSWORD:-}
      POSTGRES_DB: ${MINEFOLIO_DB_NAME:-minefolio}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
      TZ: "Asia/Shanghai"
    volumes:
      - minefolio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MINEFOLIO_DB_USER:-minefolio} -d ${MINEFOLIO_DB_NAME:-minefolio}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # PG 16 不感知 cgroup, 默认 shared_buffers 偏小; 显式 128MB, 其余查询内存走 work_mem。
    command: ["postgres", "-c", "shared_buffers=128MB"]
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  nginx:
    image: ghcr.io/quintin-lee/minefolio-frontend:${MINEFOLIO_VERSION:-1.4.1}
    container_name: minefolio-nginx
    ports:
      - "80:80"
    depends_on:
      minefolio:
        condition: service_healthy
    # 静态 SPA + 反代, 占用几乎不涨, 256m 封顶即可。
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  # QQ 机器人 (NapCat OneBot v11) 服务
  # 部署后在浏览器访问 http://<NAS或服务器IP>:6099 进入 NapCat WebUI 扫码登录 QQ 小号
  # 建议在生产 .env 中通过 NAPCAT_IMAGE 固定经过验证的镜像 tag 或 digest
  napcat:
    image: ${NAPCAT_IMAGE:-lmq8267/napcat:latest}
    container_name: minefolio-napcat
    profiles:
      - im
    environment:
      MODE: "ws"
      WEBUI_TOKEN: "${NAPCAT_WEBUI_TOKEN:-}"
      ACCOUNT: "${NAPCAT_QQ:-}"
    ports:
      - "127.0.0.1:3002:3000"   # OneBot v11 HTTP API
      - "127.0.0.1:3001:3001"   # OneBot v11 WebSocket
      - "127.0.0.1:6099:6099"   # NapCat WebUI 控制台 (扫码登录)
    volumes:
      - napcat-qq:/root/.config/QQ
      - napcat-config:/app/napcat/config
      - napcat-plugins:/app/napcat/plugins
    command: >
      bash -c "rm -f /tmp/.X*-lock /tmp/.X11-unix/X* /run/dbus/pid &&
      Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
      sleep 1 &&
      cd /app &&
      exec env DISPLAY=:99 LD_PRELOAD=./libnapcat_launcher.so /opt/QQ/qq --no-sandbox"
    restart: unless-stopped

  # IM 网关服务 (桥接 NapCat 与 Minefolio)
  im-gateway:
    image: node:${NODE_GATEWAY_VERSION:-22.14-alpine}
    container_name: minefolio-im-gateway
    profiles:
      - im
    working_dir: /app
    volumes:
      - ./gateway:/app:ro
      - im_gateway_data:/data
    environment:
      MINEFOLIO_API: "http://minefolio:8080"
      ONEBOT_WS_URL: "ws://napcat:3001"
      ONEBOT_API_URL: "http://napcat:3000"
      ONEBOT_ACCESS_TOKEN: "${NAPCAT_ACCESS_TOKEN:-}"
      ONEBOT_BIND_TOKEN: "${ONEBOT_BIND_TOKEN:-}"
      CACHE_FILE: "/data/im_bindings.json"
      MINEFOLIO_IM_CACHE_FILE: "/data/im_bindings.json"
      NODE_ENV: "production"
    command: ["node", "adapters/onebot-server.js"]
    depends_on:
      - minefolio
      - napcat
    restart: unless-stopped

  # 微信 iLink 用户级独立实例网关 (每实例独立子进程与 state 目录)
  ilink-gateway:
    image: node:${NODE_GATEWAY_VERSION:-22.14-alpine}
    container_name: minefolio-ilink-gateway
    profiles:
      - im
    working_dir: /app
    command: ["node", "ilink-server.js"]
    environment:
      MINEFOLIO_API: "http://minefolio:8080"
      MINEFOLIO_GATEWAY_TOKEN: "${MINEFOLIO_GATEWAY_TOKEN:?set MINEFOLIO_GATEWAY_TOKEN}"
      ILINK_STATE_DIR: "/state"
      NODE_ENV: "production"
    volumes:
      - ./gateway:/app:ro
      - ilink_state:/state
    depends_on:
      - minefolio
    restart: unless-stopped

volumes:
  minefolio-data:
  minefolio-pgdata:
  napcat-qq:
  napcat-config:
  napcat-plugins:
  im_gateway_data:
  ilink_state:
