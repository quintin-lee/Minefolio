services:
  minefolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: minefolio:latest
    container_name: minefolio
    expose:
      - "8080"
    environment:
      MINEFOLIO_JWT_SECRET: "${MINEFOLIO_JWT_SECRET:?MINEFOLIO_JWT_SECRET is required}"
      MINEFOLIO_DB_DSN: "/app/data/minefolio.db"
      MINEFOLIO_ENABLE_CSRF: "1"
    volumes:
      - minefolio-data:/app/data
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: minefolio-nginx:latest
    container_name: minefolio-nginx
    ports:
      - "80:80"
    depends_on:
      - minefolio
    restart: unless-stopped

volumes:
  minefolio-data:
