name: build-docker

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - runtime
          - nginx
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4

      - name: Set up Docker Buildx
        uses: https://gitea.com/actions/docker-setup-buildx@v3

      - name: Compute image metadata
        id: meta
        run: |
          REGISTRY="${{ secrets.REGISTRY }}"
          if [ -z "$REGISTRY" ]; then
            # Default to the built-in Gitea package registry (host of the instance).
            REGISTRY="$(echo "${{ gitea.server_url }}" | sed -E 's#^https?://##')"
          fi
          IMAGE="${REGISTRY}/${{ gitea.repository }}"
          if [ "${{ matrix.target }}" = "nginx" ]; then
            IMAGE="${IMAGE}-nginx"
          fi
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          TAGS="${IMAGE}:latest"
          if [ -n "${{ gitea.ref_type }}" ] && [ "${{ gitea.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:${{ gitea.ref_name }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: https://gitea.com/actions/docker-login@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || gitea.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || gitea.token }}

      - name: Build and push (${{ matrix.target }})
        uses: https://gitea.com/actions/docker-build-push@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            HTTP_PROXY=${{ vars.HTTP_PROXY }}
            HTTPS_PROXY=${{ vars.HTTPS_PROXY }}
            GITHUB_PROXY=${{ vars.GITHUB_PROXY }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY }}
          cache-from: type=inline
          cache-to: type=inline,mode=max
