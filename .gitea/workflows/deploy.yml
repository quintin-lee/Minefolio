name: finance-pro-deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    env:
      TARGET_DIR: /volume3/Synology/docker/minefolio

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4

      # ── 2. Compute image metadata ────────────────────────────
      - name: Compute image metadata
        id: meta
        run: |
          REGISTRY="${{ secrets.GITEA_REGISTRY }}"
          if [ -z "$REGISTRY" ]; then
            REGISTRY="$(echo "${{ gitea.server_url }}" | sed -E 's#^https?://##')"
          fi
          REPO="${{ gitea.repository }}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "backend_img=${REGISTRY}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "frontend_img=${REGISTRY}/${REPO}-frontend" >> "$GITHUB_OUTPUT"
          BRANCH="${{ github.ref_name }}"
          TAG_SUFFIX="${BRANCH#v}"
          echo "tag=${TAG_SUFFIX}" >> "$GITHUB_OUTPUT"
          # 不可变版本 tag：每次部署唯一，供 rollback.sh 精确回滚
          echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # ── 3. Set up Docker Buildx ─────────────────────────────
      - name: Set up Docker Buildx
        uses: https://gitea.com/actions/docker-setup-buildx@v3

      # ── 4. Login to registry ────────────────────────────────
      - name: Log in to registry
        uses: https://gitea.com/actions/docker-login@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME || gitea.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || gitea.token }}

      # ── 5. Build & push backend image ───────────────────────
      - name: Build & push backend image
        uses: https://gitea.com/actions/docker-build-push@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_img }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.backend_img }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend_img }}:latest
          build-args: |
            HTTP_PROXY=${{ vars.HTTP_PROXY }}
            HTTPS_PROXY=${{ vars.HTTPS_PROXY }}
            GITHUB_PROXY=${{ vars.GITHUB_PROXY }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY }}
          cache-from: type=inline
          cache-to: type=inline,mode=max

      # ── 6. Build & push frontend image ──────────────────────
      - name: Build & push frontend image
        uses: https://gitea.com/actions/docker-build-push@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_img }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.frontend_img }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend_img }}:latest
          build-args: |
            HTTP_PROXY=${{ vars.HTTP_PROXY }}
            HTTPS_PROXY=${{ vars.HTTPS_PROXY }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY }}
          cache-from: type=inline
          cache-to: type=inline,mode=max

      # ── 7. Install SSH tools ────────────────────────────────
      - name: Install SSH tools
        run: |
          set -e
          if command -v sshpass >/dev/null 2>&1; then
            echo "✅ sshpass already installed"
            exit 0
          fi
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache sshpass openssh-client
          elif command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq openssh-client sshpass
          elif command -v yum >/dev/null 2>&1; then
            $SUDO yum install -y -q openssh-clients sshpass 2>/dev/null || $SUDO yum install -y -q openssh sshpass
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y -q openssh-clients sshpass
          else
            echo "⚠️ 未识别包管理器，跳过 sshpass 安装"
          fi
          which sshpass || (echo "❌ sshpass 未安装成功" && exit 1)
          which ssh || (echo "❌ ssh 未安装成功" && exit 1)
          ssh -V

      # ── 8. Deploy to Synology ───────────────────────────────
      # 使用仓库自带的完整 docker-compose.yml（不再硬编码简化版），
      # 通过 .env 注入不可变版本 tag 与 secrets，避免配置漂移。
      - name: Deploy to Synology
        env:
          SSH_HOST: ${{ secrets.SYNOLOGY_SSH_HOST }}
          SSH_PORT: ${{ secrets.SYNOLOGY_SSH_PORT }}
          SSH_USER: ${{ secrets.SYNOLOGY_SSH_USER }}
          SSH_PASS: ${{ secrets.SYNOLOGY_SSH_PASS }}
          SSH_KEY: ${{ secrets.SYNOLOGY_SSH_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          MINEFOLIO_JWT_SECRET: ${{ secrets.MINEFOLIO_JWT_SECRET }}
          MINEFOLIO_GATEWAY_TOKEN: ${{ secrets.MINEFOLIO_GATEWAY_TOKEN }}
          MINEFOLIO_DB_DRIVER: ${{ vars.MINEFOLIO_DB_DRIVER || 'sqlite' }}
          MINEFOLIO_DB_PASSWORD: ${{ secrets.MINEFOLIO_DB_PASSWORD }}
          MINEFOLIO_DB_USER: ${{ vars.MINEFOLIO_DB_USER || 'minefolio' }}
          MINEFOLIO_DB_NAME: ${{ vars.MINEFOLIO_DB_NAME || 'minefolio' }}
        run: |
          set -euo pipefail
          [ -z "$SSH_HOST" ] && echo "❌ SYNOLOGY_SSH_HOST 未配置" && exit 1
          [ -z "$SSH_USER" ] && echo "❌ SYNOLOGY_SSH_USER 未配置" && exit 1

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          if [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" > /tmp/mf_deploy_key
            chmod 600 /tmp/mf_deploy_key
            SSH_OPTS="-i /tmp/mf_deploy_key $SSH_OPTS"
          elif [ -z "${SSH_PASS:-}" ]; then
            echo "❌ SYNOLOGY_SSH_PASS 或 SYNOLOGY_SSH_KEY 至少配置一个" && exit 1
          fi

          ssh_run() {
            if [ -n "${SSH_PASS:-}" ]; then
              sshpass -p "$SSH_PASS" ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$@"
            else
              ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$@"
            fi
          }
          scp_to() {
            if [ -n "${SSH_PASS:-}" ]; then
              sshpass -p "$SSH_PASS" scp -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$@"
            else
              scp -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /tmp/mf_deploy_key "$@"
            fi
          }

          echo "🚀 部署版本 ${VERSION}..."
          ssh_run "mkdir -p '${TARGET_DIR}/docker'"

          # 上传完整 compose 及其挂载依赖；root 下 compose 镜像 tag 由 .env 的 MINEFOLIO_VERSION 决定
          scp_to docker-compose.yml "$SSH_USER@$SSH_HOST:${TARGET_DIR}/docker-compose.yml"
          scp_to docker/db-wait.sh "$SSH_USER@$SSH_HOST:${TARGET_DIR}/docker/db-wait.sh"
          scp_to -r gateway "$SSH_USER@$SSH_HOST:${TARGET_DIR}/"
          # 运维脚本随部署上传，供 minefolio.sh --host 远程调用
          scp_to -r scripts "$SSH_USER@$SSH_HOST:${TARGET_DIR}/"

          # 保留远程已有 JWT secret，避免每次部署使全部会话失效
          EXISTING_SECRET="$(ssh_run \
            "[ -f '${TARGET_DIR}/.env' ] && sed -n 's/^MINEFOLIO_JWT_SECRET=//p' '${TARGET_DIR}/.env' | head -1 || true")"
          JWT_SECRET="${EXISTING_SECRET:-${MINEFOLIO_JWT_SECRET:-}}"
          [ -n "$JWT_SECRET" ] || { echo "❌ 首次部署需配置 secrets.MINEFOLIO_JWT_SECRET" && exit 1; }

          cat > /tmp/minefolio.env <<EOF
          MINEFOLIO_VERSION=${VERSION}
          MINEFOLIO_JWT_SECRET=${JWT_SECRET}
          MINEFOLIO_GATEWAY_TOKEN=${MINEFOLIO_GATEWAY_TOKEN:-}
          MINEFOLIO_DB_DRIVER=${MINEFOLIO_DB_DRIVER:-sqlite}
          MINEFOLIO_DB_PASSWORD=${MINEFOLIO_DB_PASSWORD:-}
          MINEFOLIO_DB_USER=${MINEFOLIO_DB_USER:-minefolio}
          MINEFOLIO_DB_NAME=${MINEFOLIO_DB_NAME:-minefolio}
          EOF
          scp_to /tmp/minefolio.env "$SSH_USER@$SSH_HOST:${TARGET_DIR}/.env"
          rm -f /tmp/minefolio.env /tmp/mf_deploy_key
          ssh_run "chmod 600 '${TARGET_DIR}/.env'"

          echo "🐳 拉取镜像并启动..."
          ssh_run \
            "cd '${TARGET_DIR}' && if sudo docker compose version >/dev/null 2>&1; then DC='sudo docker compose'; else DC='sudo docker-compose'; fi && \$DC pull && \$DC up -d && \$DC ps"

          # 成功部署后写入版本历史，供 rollback.sh 回滚
          ssh_run \
            "cd '${TARGET_DIR}' && echo '${VERSION}' >> .deploy-history && echo '${VERSION}' > .deployed-version"

          echo "🏥 健康检查..."
          ssh_run \
            "for i in \$(seq 1 30); do docker exec minefolio curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && exit 0; sleep 2; done; echo '❌ 健康检查失败'; docker logs --tail=100 minefolio; exit 1"

          echo "✅ 部署完成: ${VERSION}"
